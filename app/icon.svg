<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- dark rounded backdrop so the reticle reads on light or dark tab bars -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#050810"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="21.5" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>

  <!-- faint base ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="2"/>

  <!-- radial tick marks (quadrants long, others short) -->
  <g stroke="#7dd3fc" stroke-width="2.4" stroke-linecap="round">
    <line x1="50" y1="14" x2="50" y2="23"/>
    <line x1="50" y1="86" x2="50" y2="77"/>
    <line x1="14" y1="50" x2="23" y2="50"/>
    <line x1="86" y1="50" x2="77" y2="50"/>
  </g>
  <g stroke="rgba(125,211,252,0.6)" stroke-width="1.8" stroke-linecap="round">
    <line x1="74.5" y1="25.5" x2="69.5" y2="30.5"/>
    <line x1="25.5" y1="25.5" x2="30.5" y2="30.5"/>
    <line x1="74.5" y1="74.5" x2="69.5" y2="69.5"/>
    <line x1="25.5" y1="74.5" x2="30.5" y2="69.5"/>
  </g>

  <!-- bright counter-rotating-style arcs -->
  <path d="M50 16 A34 34 0 0 1 84 50" fill="none" stroke="#7dd3fc" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M50 84 A34 34 0 0 1 16 50" fill="none" stroke="#22d3ee" stroke-width="3.2" stroke-linecap="round"/>

  <!-- inner ring + glowing core -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="rgba(56,189,248,0.55)" stroke-width="1.6" stroke-dasharray="5 7"/>
  <circle cx="50" cy="50" r="9" fill="rgba(125,211,252,0.22)"/>
  <circle cx="50" cy="50" r="4.5" fill="#7dd3fc"/>
</svg>
